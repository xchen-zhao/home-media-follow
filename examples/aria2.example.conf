# UTF-8. Copy to a private, instance-owned configuration file.
# Replace the RPC secret locally; do not commit the configured file.
enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
rpc-secret=REPLACE_LOCALLY_WITH_A_NEW_RPC_SECRET
# Create the directory and an initially empty session.txt before first start.
# input-file and save-session must refer to exactly the same file.
input-file=C:/HomeMediaFollow/aria2/session.txt
save-session=C:/HomeMediaFollow/aria2/session.txt
save-session-interval=30
# No global on-download-complete hook is required.
